<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08111F"/>
      <stop offset="50%" stop-color="#0E1F35"/>
      <stop offset="100%" stop-color="#142946"/>
    </linearGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5A4"/>
      <stop offset="35%" stop-color="#D8AD55"/>
      <stop offset="70%" stop-color="#9C7524"/>
      <stop offset="100%" stop-color="#EAC473"/>
    </linearGradient>

    <!-- Glowing Accent -->
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#D8AD55" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#08111F" stop-opacity="0"/>
    </radialGradient>

    <filter id="goldDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D8AD55" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="180" r="160" fill="url(#glowGrad)"/>

  <!-- Outer Emblem Shield -->
  <path d="M 200,20 
           C 320,20 370,70 370,160 
           C 370,270 270,345 200,380 
           C 130,345 30,270 30,160 
           C 30,70 80,20 200,20 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#goldGrad)" 
        stroke-width="7" 
        stroke-linejoin="round"/>

  <!-- Inner Trim Line -->
  <path d="M 200,36 
           C 306,36 352,80 352,160 
           C 352,258 262,328 200,360 
           C 138,328 48,258 48,160 
           C 48,80 94,36 200,36 Z" 
        fill="none" 
        stroke="url(#goldGrad)" 
        stroke-width="1.8" 
        stroke-dasharray="6,4" 
        opacity="0.75"/>

  <!-- Crossed Cricket Bats Behind Trophy -->
  <g opacity="0.65" stroke="url(#goldGrad)" stroke-width="3">
    <!-- Left Bat (Angled Right) -->
    <line x1="110" y1="270" x2="290" y2="90" stroke-linecap="round"/>
    <rect x="250" y="70" width="14" height="60" rx="3" transform="rotate(45 257 100)" fill="url(#goldGrad)"/>
    <!-- Right Bat (Angled Left) -->
    <line x1="290" y1="270" x2="110" y2="90" stroke-linecap="round"/>
    <rect x="136" y="70" width="14" height="60" rx="3" transform="rotate(-45 143 100)" fill="url(#goldGrad)"/>
  </g>

  <!-- Majestic Championship Trophy -->
  <g filter="url(#goldDrop)" fill="url(#goldGrad)">
    <!-- Trophy Cup Rim -->
    <ellipse cx="200" cy="115" rx="55" ry="12"/>
    <!-- Cup Body -->
    <path d="M 145,115 
             C 145,185 165,215 190,225 
             L 190,250 
             L 175,255 
             L 175,270 
             L 225,270 
             L 225,255 
             L 210,250 
             L 210,225 
             C 235,215 255,185 255,115 Z"/>

    <!-- Left Handle -->
    <path d="M 148,125 
             C 115,135 115,185 155,190 
             C 145,178 142,145 152,136 Z" fill="url(#goldGrad)"/>

    <!-- Right Handle -->
    <path d="M 252,125 
             C 285,135 285,185 245,190 
             C 255,178 258,145 248,136 Z" fill="url(#goldGrad)"/>

    <!-- Trophy Pedestal Base -->
    <polygon points="160,270 240,270 248,285 152,285"/>
    <rect x="146" y="285" width="108" height="18" rx="3"/>

    <!-- Star on Cup -->
    <polygon points="200,140 204,152 216,152 206,160 210,172 200,164 190,172 194,160 184,152 196,152" fill="#08111F"/>
  </g>

  <!-- Championship Ribbons & Stars -->
  <g fill="url(#goldGrad)">
    <polygon points="105,75 108,83 117,83 110,88 112,96 105,91 98,96 100,88 93,83 102,83"/>
    <polygon points="295,75 298,83 307,83 300,88 302,96 295,91 288,96 290,88 283,83 292,83"/>
    <polygon points="200,50 203,57 210,57 205,61 207,68 200,64 193,68 195,61 190,57 197,57"/>
  </g>

  <!-- Crisp Bottom Typography -->
  <text x="200" y="324" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#FCE5A4" letter-spacing="4">CRICKET LEAGUE</text>
  <text x="200" y="342" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="10" fill="#D8AD55" letter-spacing="2">CHAMPIONSHIP</text>
</svg>
