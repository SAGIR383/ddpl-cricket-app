<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CricPlus</title>
<meta name="theme-color" content="#12306b">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f9;--card:#fff;--tx:#10213f;--mu:#5f6f8a;--ac:#ff9f1c;--on-ac:#10213f;--navy:#12306b;--hd:#12306b;--bd:#d9e2ef;--red:#d62839;--blue:#1a73b8}
@media(prefers-color-scheme:dark){:root{--bg:#0a1325;--card:#13213b;--tx:#eaf0fb;--mu:#93a4c3;--hd:#9dbcff;--navy:#0d2150;--bd:#233456;--red:#ff6b78;--blue:#6db3ee}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 'Nunito Sans',system-ui,sans-serif}
h1,.big,.fd{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif}
.w{max-width:520px;margin:0 auto;padding:12px 12px 40px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;margin-bottom:16px;border-radius:16px;color:#fff;background:repeating-conic-gradient(from -4deg at 12% 50%,rgba(255,159,28,.22) 0 7deg,transparent 7deg 14deg),var(--navy);border-bottom:3px solid var(--ac)}
.top a{color:#ffc766;font-weight:700}
h1{font-size:28px;font-weight:700;line-height:1.1;margin:8px 2px 12px;color:var(--hd)}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.c>b:first-child{display:block;font:700 20px/1.2 'Barlow Condensed',system-ui,sans-serif;color:var(--hd);margin-bottom:6px}
input,textarea,select{width:100%;padding:11px 12px;margin:4px 0 12px;border:1.5px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;font-size:16px}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
button{font:inherit;font-weight:600;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:12px 0;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
button.p{background:var(--ac);color:var(--on-ac);border:0;width:100%;padding:13px;font-weight:800;font-size:16px;margin-top:4px}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.g button{padding:15px 0;font-size:17px;font-weight:700}
.big{font-size:46px;font-weight:700;line-height:1}
.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}td,th{padding:7px 3px;text-align:right}td:first-child,th:first-child{text-align:left}
th{font-weight:600;font-size:12px;color:var(--mu)}tr+tr td{border-top:1px solid var(--bd)}
.ch{display:inline-block;min-width:32px;text-align:center;padding:4px 8px;margin:2px;border-radius:999px;background:var(--bg);border:1.5px solid var(--bd);font-weight:700}
.wk{background:var(--red);color:#fff;border-color:var(--red)}.ov{overflow-x:auto}a{color:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
.hero{color:#fff;border:0;border-bottom:3px solid var(--ac);background:repeating-conic-gradient(from -4deg at 88% 130%,rgba(255,159,28,.2) 0 7deg,transparent 7deg 14deg),var(--navy)}
.hero .mu{color:#b9c8ee}
.pill{display:inline-block;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:800}
.pl{background:var(--red);color:#fff}.pu{border:1.5px solid var(--ac)}.pd{background:var(--bd);color:var(--mu)}
</style></head><body><div class="w" id="app">Loading…</div>

{const k=document.createElement('link');k.rel='icon';k.href=LOGO;document.head.appendChild(k)}
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const app=document.getElementById('app'),$=i=>document.getElementById(i);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let user=null,V={v:'home'},LS=[],lg=null,fx=[],pl=[],ad=[],AU=[],AR=[],TM=[],AA=[],FS=[],MY=new Set(),M=null,H=[],ch=null;
const own=()=>!!(user&&lg&&lg.owner==user.id);
const isA=u=>!!lg&&(lg.owner==u||ad.some(a=>a.user_id==u));
const adm=()=>!!user&&isA(user.id);
const bar=()=>`<div class="top"><div onclick="nav('home')" style="cursor:pointer;display:flex;align-items:center;gap:10px"><img src="${LOGO}" alt="DDPL" style="width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.75)"><div><div class="fd" style="font-weight:700;font-size:24px;line-height:1">CricPlus</div><div style="font-size:12px;opacity:.8">Cricket scoring &amp; auctions</div></div></div><div style="text-align:right;font-size:12px">${user?`${esc(user.email.split('@')[0])}<br><a href="#" onclick="out();return false">Logout</a>`:`<a href="#" onclick="nav('auth');return false">Login</a>`}</div></div>`;
const pill=x=>x=='live'?'<span class="pill pl">● Live</span>':x=='done'?'<span class="pill pd">Completed</span>':'<span class="pill pu">Upcoming</span>';
const put=h=>app.innerHTML=bar()+h;
const back=(t,f)=>`<button style="width:100%;padding:10px;margin-top:8px" onclick="${f}">${t}</button>`;

async function init(){
 const {data}=await sb.auth.getSession();user=data.session?data.session.user:null;
 sb.auth.onAuthStateChange((_,s)=>{user=s?s.user:null});
 nav('home');
}
async function nav(v,x){
 V={v,...x};
 if(v=='home'||v=='auth'){if(ch){sb.removeChannel(ch);ch=null}}
 if(v=='home'){
  const [a,b,c,d]=await Promise.all([sb.from('leagues').select('*').order('created_at',{ascending:false}),sb.from('auctions').select('*').order('created_at',{ascending:false}),sb.from('fixtures').select('league_id,status'),user?sb.from('league_admins').select('league_id').eq('user_id',user.id):Promise.resolve({data:[]})]);
  LS=a.data||[];AA=b.data||[];FS=c.data||[];
  MY=new Set(LS.filter(l=>user&&l.owner==user.id).map(l=>l.id).concat((d.data||[]).map(x=>x.league_id)));
 }
 if(v=='league'){await load(V.id);sub()}
 draw();
}
async function load(id){
 const [a,b,c,d,e,f]=await Promise.all([sb.from('leagues').select('*').eq('id',id).single(),sb.from('fixtures').select('*').eq('league_id',id).order('created_at'),sb.from('players').select('*').eq('league_id',id),sb.from('league_admins').select('*').eq('league_id',id),sb.from('auctions').select('*').eq('league_id',id).order('created_at',{ascending:false}),sb.from('auction_results').select('*').eq('league_id',id).order('created_at')]);
 lg=a.data;fx=b.data||[];pl=c.data||[];ad=d.data||[];AU=e.data||[];AR=f.data||[];
}
function sub(){
 if(ch)sb.removeChannel(ch);
 const f=t=>({event:'*',schema:'public',table:t,filter:'league_id=eq.'+lg.id});
 const h=async()=>{
  if(V.v=='join'||V.v=='newa'||V.v=='editl'||(V.v=='match'&&adm()))return;
  await load(lg.id);
  if(V.v=='match')M=(fx.find(x=>x.id==V.fid)||{}).state;
  draw();
 };
 ch=sb.channel('l'+lg.id).on('postgres_changes',f('fixtures'),h).on('postgres_changes',f('players'),h).on('postgres_changes',f('league_admins'),h).on('postgres_changes',f('auctions'),h).on('postgres_changes',f('auction_results'),h).subscribe();
}
function draw(){({auth:authV,home:homeV,league:leagueV,join:joinV,match:matchV,newl:newV,newa:newAV,editl:editLV,auc:aucV}[V.v]||homeV)()}

// ---------- league ----------
function table(){
 const T={};lg.teams.forEach(n=>T[n]={n,p:0,w:0,l:0,t:0,pt:0,rf:0,bf:0,ra:0,ba:0});
 fx.forEach(f=>{const r=f.result;if(!r||!T[f.a]||!T[f.b])return;const A=T[f.a],B=T[f.b];
  A.p++;B.p++;A.rf+=r.ra;A.bf+=r.ba;A.ra+=r.rb;A.ba+=r.bb;B.rf+=r.rb;B.bf+=r.bb;B.ra+=r.ra;B.ba+=r.ba;
  if(r.w=='a'){A.w++;B.l++;A.pt+=2}else if(r.w=='b'){B.w++;A.l++;B.pt+=2}else{A.t++;B.t++;A.pt++;B.pt++}});
 return Object.values(T).map(x=>({...x,nrr:(x.bf?x.rf*6/x.bf:0)-(x.ba?x.ra*6/x.ba:0)})).sort((a,b)=>b.pt-a.pt||b.nrr-a.nrr);
}
function leagueV(){
 if(!lg)return put('<div class="c">League not found.</div>'+back('Back',"nav('home')"));
 const me=user&&pl.find(p=>p.user_id==user.id);
 put(`<h1 style="display:flex;align-items:center;gap:10px">${lg.logo?`<img src="${esc(lg.logo)}" alt="" style="width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid var(--bd)">`:'🏆'}<span>${esc(lg.name)}</span></h1><div class="c ov"><b>Points table</b> <span class="mu">(win 2, tie 1)</span><table><tr class="mu"><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>Pts</th><th>NRR</th></tr>${table().map(x=>`<tr><td>${esc(x.n)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td><b>${x.pt}</b></td><td>${x.nrr>=0?'+':''}${x.nrr.toFixed(3)}</td></tr>`).join('')}</table></div>
 <div class="c"><b>Fixtures</b> <span class="mu">(${lg.overs} overs)</span>${fx.map(f=>{const lab=f.status=='done'?'View':adm()?(f.state?'Resume':'Start'):f.status=='live'?'Watch 🔴':'';return`<div class="row"><div><b>${esc(f.a)}</b> vs <b>${esc(f.b)}</b><div class="mu">${f.result?esc(f.result.m)+' · '+f.result.ra+'/'+f.result.wa+' v '+f.result.rb+'/'+f.result.wb:f.status=='live'?'Live now':'Not played'}</div></div>${lab?`<button style="padding:8px 14px" onclick="openM('${f.id}')">${lab}</button>`:''}</div>`}).join('')}</div>
 <div class="c"><b>🔨 Auctions</b>${AU.map(a=>`<div class="row"><div><b>${esc(a.name)}</b><div class="mu">${pill(a.status)} · ${AR.filter(r=>r.auction_id==a.id&&r.status=='sold').length} sold</div></div><button style="padding:8px 14px" onclick="openA('${a.id}')">${a.status=='live'?'Watch 🔴':'View'}</button></div>`).join('')||'<div class="mu">No auctions yet.</div>'}${adm()?`<button class="p" onclick="nav('newa')">+ New or past auction</button>`:''}</div>
 <div class="c ov"><b>Players (${pl.length})</b>${own()?' <span class="mu">⭐ = make/remove co-organizer</span>':''}<table><tr class="mu"><th>Name</th><th>Role</th><th>Team</th><th></th></tr>${pl.map(p=>`<tr><td>${p.photo?`<img src="${esc(p.photo)}" style="width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px">`:''}${esc(p.name)}${isA(p.user_id)?' ⭐':''}</td><td>${esc(p.role)}</td><td>${adm()?`<select onchange="setTeam('${p.user_id}',this.value)" style="width:auto;padding:4px;margin:0"><option value="">–</option>${lg.teams.map(t=>`<option ${t==p.team?'selected':''}>${esc(t)}</option>`).join('')}</select>`:esc(p.team||'–')}</td><td style="white-space:nowrap">${own()&&p.user_id!=lg.owner?`<button style="padding:2px 8px" onclick="toggleAdm('${p.user_id}')">⭐</button> `:''}${adm()||(user&&p.user_id==user.id)?`<button style="padding:2px 8px" onclick="leave('${p.user_id}')">✕</button>`:''}</td></tr>`).join('')}</table></div>
 ${user?`<button class="p" onclick="nav('join')">${me?'Edit my player profile':'Join as a player'}</button>`:'<div class="mu">Log in to join as a player.</div>'}${own()?`<button style="width:100%;padding:10px;margin-top:8px" onclick="nav('editl')">Edit league name &amp; logo</button>`:''}${back('Back',"nav('home')")}`);
}

}
function shrink(file,max=400,q=.82){return new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>b?ok(b):no(new Error('Could not read image')),'image/jpeg',q)};im.onerror=()=>no(new Error('That file is not an image'));im.src=URL.createObjectURL(file)})}
async function fit(file){for(const m of [400,320,240,160])for(const q of [.82,.7,.55,.4]){const b=await shrink(file,m,q);if(b.size<=102400)return b}throw new Error('This photo is too big. Please choose a smaller one (max 100 KB).')}
async function psave(){
 const n=$('pn').value.trim();if(!n)return;

 if(fl){try{const b=await fit(fl),path=user.id+'/'+lg.id+'.jpg';const u=await sb.storage.from('player-photos').upload(path,b,{upsert:true,contentType:'image/jpeg'});if(u.error)return alert('Photo upload failed: '+u.error.message);photo=sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl+'?v='+Date.now()}catch(e){return alert(e.message)}}
 const row={user_id:user.id,league_id:lg.id,name:n,role:$('pr').value,team:$('pt').value||null};if(photo)row.photo=photo;
 const r=await sb.from('players').upsert(row);
 if(r.error)return alert(r.error.message);nav('league',{id:lg.id});
}
async function leave(uid){if(!confirm('Remove this player?'))return;const r=await sb.from('players').delete().eq('user_id',uid).eq('league_id',lg.id);if(r.error)alert(r.error.message);else nav('league',{id:lg.id})}

async function setTeam(uid,t){const r=await sb.from('players').update({team:t||null}).eq('user_id',uid).eq('league_id',lg.id);if(r.error)alert(r.error.message);await load(lg.id);draw()}

// ---------- auctions ----------
function openA(id){V={v:'auc',aid:id};draw()}
async function startNewA(){const l=LS.find(x=>MY.has(x.id));if(!l)return;V={v:'newa',home:true};draw()}
function limHtml(){return `<label class="mu">Limit price (optional): the highest bid allowed for any player</label><input id="alim" type="number" placeholder="No limit">`}
function newAV(){put(`<h1>New auction</h1><div class="c">${V.home?`<label class="mu">League</label><select id="alg">${LS.filter(l=>MY.has(l.id)).map(l=>`<option value="${l.id}">${esc(l.name)}</option>`).join('')}</select>`:''}<label class="mu">Auction name</label><input id="an" placeholder="Season 1 auction"><label class="mu">Status</label><select id="as"><option value="done">Past (already finished)</option><option value="upcoming">Upcoming</option><option value="live">Live now</option></select><label class="mu">Budget per team</label><input id="ab" type="number" value="10000"><label class="mu">Base price</label><input id="abp" type="number" value="100"><label class="mu">Bid step</label><input id="ai" type="number" value="100"><div id="lims">${limHtml()}</div><label class="mu">Results (optional): one per line as Player, Team, Price. Use price 0 for unsold.</label><textarea id="al" rows="8"></textarea><button class="p" onclick="mkAuction()">Create</button></div>${back('Cancel',V.home?"nav('home')":`nav('league',{id:lg.id})`)}`)}
async function mkAuction(){
 const lid=V.home?$('alg').value:lg.id;if(!lid)return;
 const limits={},lm0=+$('alim').value;if(lm0>0){if(lm0<(+$('abp').value||100))return alert('Limit price cannot be lower than the base price');limits.all=lm0}
 const r=await sb.from('auctions').insert({limits,league_id:lid,name:$('an').value||'Auction',budget:+$('ab').value||10000,base:+$('abp').value||100,inc:+$('ai').value||100,status:$('as').value}).select().single();
 if(r.error)return alert(r.error.message);
 const rows=$('al').value.split('\n').map(x=>x.split(/[,\t]/).map(y=>y.trim())).filter(x=>x[0]).map(x=>{const pr=Math.round(parseFloat(x[2]));const sold=!!x[1]&&pr>0;return{auction_id:r.data.id,league_id:lid,player_name:x[0],team:sold?x[1]:null,price:sold?pr:null,status:sold?'sold':'unsold'}});
 if(rows.length){const q=await sb.from('auction_results').insert(rows);if(q.error)return alert(q.error.message)}
 await goA(lid,r.data.id);
}
const curA=()=>AU.find(x=>x.id==V.aid);
async function aSet(patch){const r=await sb.from('auctions').update(patch).eq('id',V.aid);if(r.error)alert(r.error.message);await load(lg.id);draw()}
const aStatus=s=>aSet({status:s,current:null});
function aNext(){const p=pl.find(x=>x.name==$('np').value),a=curA();if(!p)return;aSet({current:{name:p.name,user_id:p.user_id,photo:p.photo||null,role:p.role,bid:a.base,team:null,hist:[]}})}
function aStep(n){n=Math.round(+n);if(!(n>0))return alert('Enter a step above 0');const c=curA().current;c.step=n;aSet({current:c})}
function aBid(i){const a=curA(),c=a.current;c.hist.push({team:c.team,bid:c.bid});c.bid=c.team?c.bid+(c.step||a.inc):a.base;c.team=TM[i];aSet({current:c})}
function aUndo(){const c=curA().current;if(!c.hist.length)return;const h=c.hist.pop();c.team=h.team;c.bid=h.bid;aSet({current:c})}
async function aEnd(sold){
 const a=curA(),c=a.current;
 const r=await sb.from('auction_results').insert({auction_id:a.id,league_id:lg.id,player_name:c.name,team:sold?c.team:null,price:sold?c.bid:null,status:sold?'sold':'unsold'});
 if(r.error)return alert(r.error.message);
 if(sold&&c.user_id)await sb.from('players').update({team:c.team}).eq('user_id',c.user_id).eq('league_id',lg.id);
 aSet({current:null});
}
const ph=c=>c.photo||(pl.find(p=>p.name==c.name)||{}).photo;
const avatar=(u,n,z)=>u?`<img src="${esc(u)}" alt="" style="width:${z}px;height:${z}px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);margin-bottom:6px">`:`<div style="width:${z}px;height:${z}px;border-radius:50%;border:3px solid var(--ac);background:rgba(255,255,255,.15);display:inline-flex;align-items:center;justify-content:center;font:700 ${Math.round(z/2.4)}px 'Barlow Condensed',sans-serif;margin-bottom:6px">${esc(String(n).trim().slice(0,1).toUpperCase())}</div>`;
function aucV(){
 const a=curA();if(!a)return put('<div class="c">Auction not found.</div>'+back('Back',`nav('league',{id:lg.id})`));
 const R=AR.filter(r=>r.auction_id==a.id),cur=a.current,ed=adm();
 TM=[...new Set([...lg.teams,...R.filter(r=>r.team).map(r=>r.team)])];
 const sold=t=>R.filter(r=>r.team==t&&r.status=='sold'),spent=t=>sold(t).reduce((n,r)=>n+r.price,0);

 let live='';
 if(a.status=='live'){
  if(!cur)live=`<div class="c"><b>Waiting for the next player…</b>${ed?(avail.length?`<select id="np">${avail.map(p=>`<option>${esc(p.name)}</option>`).join('')}</select><button class="p" onclick="aNext()">Put on the block</button>`:'<div class="mu">No players left. Players must join the league first.</div>'):''}</div>`;
  else live=`<div class="c hero" style="text-align:center">${avatar(ph(cur),cur.name,130)}<div class="mu">On the block · ${esc(cur.role||'')}</div><div class="big">${esc(cur.name)}</div><div class="big" style="color:var(--ac)">${cur.bid}</div><div>${cur.team?'Leading: <b>'+esc(cur.team)+'</b>':'No bids yet · base '+a.base}</div>${(a.limits||{}).all?`<div class="mu">Limit price: ${a.limits.all}</div>`:''}</div>${ed?`${stepP}<div class="g" style="grid-template-columns:repeat(2,1fr)">${TM.map((t,i)=>{const nb=cur.team?cur.bid+stp:a.base,lm=(a.limits||{}).all;return`<button ${a.budget-spent(t)>=nb&&t!=cur.team&&(!lm||nb<=lm)?'':'disabled'} onclick="aBid(${i})">${esc(t)}<div class="mu">bid ${nb}</div></button>`}).join('')}</div><div class="g" style="grid-template-columns:repeat(3,1fr);margin-top:8px"><button style="color:var(--ac);font-weight:700" ${cur.team?'':'disabled'} onclick="aEnd(true)">SOLD</button><button onclick="aEnd(false)">Unsold</button><button onclick="aUndo()">Undo</button></div>`:''}`;
 }
 put(`<h1>🔨 ${esc(a.name)}</h1><div class="c mu">${pill(a.status)} · Budget ${a.budget}/team · Base ${a.base} · Step ${a.inc}${(a.limits||{}).all?' · Limit '+a.limits.all:''}</div>${live}
 <div class="c ov"><b>Teams</b><table><tr class="mu"><th>Team</th><th>Players</th><th>Spent</th><th>Left</th></tr>${TM.map(t=>`<tr><td>${esc(t)}</td><td>${sold(t).length}</td><td>${spent(t)}</td><td>${a.budget-spent(t)}</td></tr>`).join('')}</table></div>
 ${TM.map(t=>sold(t).length?`<div class="c"><b>${esc(t)}</b>${sold(t).map(r=>`<div class="row"><span>${esc(r.player_name)}</span><b>${r.price}</b></div>`).join('')}</div>`:'').join('')}
 ${R.some(r=>r.status=='unsold')?`<div class="c"><b>Unsold</b><div class="mu">${R.filter(r=>r.status=='unsold').map(r=>esc(r.player_name)).join(', ')}</div></div>`:''}
 ${ed?`<button class="p" ${a.status=='live'?'style="background:var(--red);color:#fff"':''} onclick="aStatus('${a.status=='live'?'done':'live'}')">${a.status=='live'?'End auction':'Start live auction'}</button>`:''}${back('Back to league',`nav('league',{id:lg.id})`)}`);
}

function editLV(){put(`<h1>Edit league</h1><div class="c"><label class="mu">League name</label><input id="en" value="${esc(lg.name)}"><label class="mu">League logo</label>${lg.logo?`<img src="${esc(lg.logo)}" alt="" style="width:72px;height:72px;border-radius:50%;object-fit:cover;display:block;margin:4px 0">`:''}<input id="el" type="file" accept="image/*"><div class="mu" style="margin:-6px 0 10px">Made smaller automatically (max 100 KB). Leave empty to keep the current logo.</div><button class="p" onclick="saveL()">Save</button></div>${back('Cancel',`nav('league',{id:lg.id})`)}`)}
async function saveL(){
 const n=$('en').value.trim();if(!n)return;
 const row={name:n},f=$('el').files[0];
 if(f){try{const b=await fit(f),path=user.id+'/league-'+Date.now()+'.jpg';const u=await sb.storage.from('player-photos').upload(path,b,{contentType:'image/jpeg'});if(u.error)return alert('Logo upload failed: '+u.error.message);row.logo=sb.storage.from('player-photos').getPublicUrl(path).data.publicUrl}catch(e){return alert(e.message)}}
 const r=await sb.from('leagues').update(row).eq('id',lg.id);if(r.error)return alert(r.error.message);
 nav('league',{id:lg.id});
}

// ---------- scoring ----------
const mk=()=>({runs:0,wk:0,balls:0,ex:0,s:0,ns:1,next:2,over:[],bat:Array.from({length:11},(_,i)=>({n:'Player '+(i+1),r:0,b:0,out:false,f4:0,f6:0}))});
const sw=I=>{[I.s,I.ns]=[I.ns,I.s]};
function openM(id){
 const f=fx.find(x=>x.id==id);V={v:'match',fid:id};H=[];
 M=f.state||(adm()?{t:[f.a,f.b],ov:lg.overs,i:0,inn:[mk()],done:false,msg:''}:null);
 if(adm()&&!f.state)push();
 draw();
}
function chk(){
 const I=M.inn[M.i];
 if(M.i==1&&I.runs>M.inn[0].runs){M.done=true;M.msg=M.t[1]+' won by '+(10-I.wk)+' wickets';return}
 if(I.balls>=M.ov*6||I.wk>=10){
  if(M.i==0){M.i=1;M.inn.push(mk())}
  else{M.done=true;const d=M.inn[0].runs-I.runs;M.msg=d>0?M.t[0]+' won by '+d+' runs':'Match tied'}
 }
}
async function push(){
 const f={state:M,status:M.done?'done':'live',result:null};
 if(M.done){const a=M.inn[0],b=M.inn[1];f.result={ra:a.runs,wa:a.wk,ba:a.wk>=10?M.ov*6:a.balls,rb:b.runs,wb:b.wk,bb:b.wk>=10?M.ov*6:b.balls,w:a.runs>b.runs?'a':a.runs<b.runs?'b':'t',m:M.msg}}
 const r=await sb.from('fixtures').update(f).eq('id',V.fid);if(r.error)alert(r.error.message);
}
function ball(r,t){
 if(M.done)return;H.push(JSON.stringify(M));
 const I=M.inn[M.i],b=I.bat[I.s];let leg=1,tot=r,l=''+r;
 if(t=='W'){b.b++;b.out=true;I.wk++;l='W';tot=0;if(I.wk<10)I.s=I.next++}
 else if(t=='wd'){leg=0;tot=r+1;I.ex+=tot;l='Wd'}
 else if(t=='nb'){leg=0;tot=r+1;I.ex++;b.r+=r;b.b++;if(r==4)b.f4++;if(r==6)b.f6++;l='Nb'}
 else if(t=='bye'||t=='lb'){I.ex+=r;b.b++;l=(t=='bye'?'B':'Lb')+r}
 else{b.r+=r;b.b++;if(r==4)b.f4++;if(r==6)b.f6++}
 I.runs+=tot;I.over.push(l);if(t!='W'&&r%2)sw(I);
 if(leg){I.balls++;if(I.balls%6==0){sw(I);I.over=[]}}
 chk();push();draw();
}
function undo(){if(H.length){M=JSON.parse(H.pop());push();draw()}}
function matchV(){
 if(!M)return put('<div class="c mu">Match not started yet.</div>'+back('Back',`nav('league',{id:lg.id})`));
 const I=M.inn[M.i],ed=adm()&&!M.done,ov=Math.floor(I.balls/6)+'.'+I.balls%6;
 const info=M.done?M.msg:M.i==1?`Need ${M.inn[0].runs+1-I.runs} from ${M.ov*6-I.balls} balls`:'1st innings';
 const rows=I.bat.map((p,k)=>({p,k})).filter(({p,k})=>k==I.s||k==I.ns||p.out||p.b>0).map(({p,k})=>`<tr><td>${p.n}${p.out?' <span class="mu">out</span>':''}${!M.done&&k==I.s&&!p.out?' *':''}</td><td>${p.r}</td><td>${p.b}</td><td>${p.f4}/${p.f6}</td><td>${p.b?(p.r*100/p.b).toFixed(0):'-'}</td></tr>`).join('');
 const B=(l,a)=>`<button onclick="${a}">${l}</button>`;
 put(`<div class="c hero"><div class="mu">${esc(M.t[M.i])} batting · ${M.ov} overs ${M.done?'':'· 🔴 live'}</div><div class="big">${I.runs}/${I.wk} <span class="mu" style="font-size:16px">(${ov})</span></div><div class="mu">CRR ${I.balls?(I.runs*6/I.balls).toFixed(2):'0.00'} · Extras ${I.ex}</div><b>${esc(info)}</b>${M.i==1?`<div class="mu">${esc(M.t[0])}: ${M.inn[0].runs}/${M.inn[0].wk}</div>`:''}</div>
 <div class="c ov"><table><tr class="mu"><th>Batter</th><th>R</th><th>B</th><th>4/6</th><th>SR</th></tr>${rows}</table></div>
 <div class="c"><div class="mu">This over</div>${I.over.map(x=>`<span class="ch ${x=='W'?'wk':''}">${x}</span>`).join('')||'–'}</div>
 ${ed?`<div class="g">${[0,1,2,3,4,6].map(r=>B(r,`ball(${r},'n')`)).join('')}${B('Wide',"ball(0,'wd')")}${B('No ball',"ball(0,'nb')")}${B('Bye',"ball(1,'bye')")}${B('Leg bye',"ball(1,'lb')")}<button style="color:var(--red);font-weight:700" onclick="ball(0,'W')">OUT</button>${B('Undo','undo()')}</div>`:''}
 ${back('Back to league',`nav('league',{id:lg.id})`)}`);
}
init();
</script></body></html>
